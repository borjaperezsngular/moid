<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Publicador falso - prueba MOID</title>
<script src="https://cdn.jsdelivr.net/npm/prebid.js@latest/dist/prebid.js"></script>
<script>
  var pbjs = pbjs || {};
  pbjs.que = pbjs.que || [];
</script>
  <script>
    var moidPurposeConsents = { 1: true, 3: true, 4: true, 7: true };
    var moidTcData = {
      gdprApplies: false,
      cmpStatus: 'loaded',
      eventStatus: 'tcloaded',
      purpose: { consents: moidPurposeConsents },
      vendor: { consents: {} },
      purposeConsents: moidPurposeConsents,
      vendorConsents: {},
      listenerId: 1
    };

    window.__tcfapi = function (command, version, callback) {
      if (version !== 2) {
        callback(null, false);
        return;
      }

      if (command === 'getTCData') {
        callback(moidTcData, true);
        return;
      }

      if (command === 'addEventListener') {
        callback(moidTcData, true);
        return moidTcData.listenerId;
      }

      if (command === 'removeEventListener') {
        callback(moidTcData, true);
        return;
      }

      if (command === 'ping') {
        callback({
          gdprApplies: false,
          cmpLoaded: true,
          cmpId: 1,
          cmpStatus: 'loaded',
          apiVersion: '2.0',
          tcfPolicyVersion: 2
        }, true);
        return;
      }

      callback(null, false);
    };
  </script>

  <script>
    window.MasOrangeMoidConfig = {
      VENDOR_ID: null,
      ENDPOINT: 'https://advertising-moid-middleware.sta.masstack.com/v1/api/moid/resolve'
    };
  </script>
</head>
<body>
  <h1>Publicador externo falso</h1>
  <div id="div-gpt-ad" role="group" aria-label="Contenedor del anuncio de prueba"></div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.async = true;
      s.onload = function () {
        console.log(pbjs);
      };
      s.onerror = function () {
        document.getElementById('div-gpt-ad').textContent = 'No se pudo cargar el script del publisher.';
      };
      s.src = 'https://advertising-moid-middleware.sta.masstack.com/v1/api/moid/loader.js';
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
