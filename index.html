<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Publicador falso - prueba MOID</title>

  <script>
    window.pbjs = window.pbjs || { que: [] };
  </script>

  <!-- CMP mock -->
  <script>
    var moidPurposeConsents = { 1: true, 3: true, 4: true, 7: true };
    var moidTcData = {
      gdprApplies: false,
      cmpStatus: 'loaded',
      eventStatus: 'tcloaded',
      purpose: { consents: moidPurposeConsents },
      vendor: { consents: {} },
      purposeConsents: moidPurposeConsents,
      vendorConsents: {},
      listenerId: 1
    };

    window.__tcfapi = function (command, version, callback) {
      if (version !== 2) return callback(null, false);
      if (command === 'getTCData') return callback(moidTcData, true);
      if (command === 'addEventListener') { callback(moidTcData, true); return moidTcData.listenerId; }
      if (command === 'removeEventListener') return callback(moidTcData, true);
      if (command === 'ping') return callback({ gdprApplies: false, cmpLoaded: true, cmpId: 1, cmpStatus: 'loaded', apiVersion: '2.0', tcfPolicyVersion: 2 }, true);
      callback(null, false);
    };
  </script>

  <script>
    window.MasOrangeMoidConfig = {
      VENDOR_ID: null,
      ENDPOINT: 'https://advertising-moid-middleware.sta.masstack.com/v1/api/moid/resolve'
    };
  </script>
</head>
<body>
  <h1>Publicador externo falso</h1>
  <div id="div-gpt-ad" role="group" aria-label="Contenedor del anuncio de prueba"></div>

  <script>
    function loadMoidLoader() {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://advertising-moid-middleware.sta.masstack.com/v1/api/moid/loader.js';
      s.onload = function () {
        // Re-intentar integración por si init corrió antes de que Prebid estuviera 100% listo
        if (window.MasOrangeMoid?.init) {
          window.MasOrangeMoid.init();
        }
      };
      s.onerror = function () {
        document.getElementById('div-gpt-ad').textContent = 'No se pudo cargar moid-loader.js';
      };
      document.head.appendChild(s);
    }

    // 1) Prebid completo primero
    var prebidScript = document.createElement('script');
    prebidScript.src = 'https://cdn.jsdelivr.net/npm/prebid.js@latest/dist/prebid.js';
    prebidScript.onload = loadMoidLoader;
    prebidScript.onerror = function () {
      document.getElementById('div-gpt-ad').textContent = 'No se pudo cargar prebid.js';
    };
    document.head.appendChild(prebidScript);
  </script>
</body>
</html>
