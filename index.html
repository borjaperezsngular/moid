<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Publicador falso - prueba MOID</title>

  <script>
    var moidPurposeConsents = { 1: true, 3: true, 4: true, 7: true };
    var moidTcData = {
      gdprApplies: false,
      cmpStatus: 'loaded',
      eventStatus: 'tcloaded',
      purpose: { consents: moidPurposeConsents },
      vendor: { consents: {} },
      purposeConsents: moidPurposeConsents,
      vendorConsents: {},
      listenerId: 1
    };

    window.__tcfapi = function (command, version, callback) {
      if (version !== 2) {
        callback(null, false);
        return;
      }

      if (command === 'getTCData') {
        callback(moidTcData, true);
        return;
      }

      if (command === 'addEventListener') {
        callback(moidTcData, true);
        return moidTcData.listenerId;
      }

      if (command === 'removeEventListener') {
        callback(true);
        return;
      }

      if (command === 'ping') {
        callback({
          gdprApplies: false,
          cmpLoaded: true,
          cmpId: 1,
          cmpStatus: 'loaded',
          apiVersion: '2.0',
          tcfPolicyVersion: 2
        }, true);
        return;
      }

      callback(null, false);
    };
  </script>

  <script>
    window.MasOrangeMoidConfig = {
      VENDOR_ID: null,
      ENDPOINT: 'https://masorangeadvertising.es/advertising/moid'
    };
  </script>

  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  <script>
    window.googletag = window.googletag || { cmd: [] };
    googletag.cmd.push(function () {
      googletag.defineSlot('/6355419/Travel/Europe', [300, 250], 'div-gpt-ad')
        .addService(googletag.pubads());
      googletag.pubads().disableInitialLoad();
      googletag.enableServices();
    });
  </script>
</head>
<body>
  <h1>Publicador externo falso</h1>
  <div id="div-gpt-ad" role="group" aria-label="Contenedor del anuncio de prueba"></div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.async = true;
      s.onload = function () {
        googletag.cmd.push(function () {
          googletag.display('div-gpt-ad');
          googletag.pubads().refresh();
        });
      };
      s.src = 'https://masorangeadvertising.es/advertising/publisher-script?siteId=test';
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
